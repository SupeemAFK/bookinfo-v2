imagePullSecrets:
  - name: harbor-creds-dev 

ingress:
  name: bookinfo-ingress-dev
  enabled: true
  className: nginx
  host: bookinfo-supeem-dev.opsta.in.th
  tls:
    enabled: true
    secretName: bookinfo-tls-secret
    issuer: letsencrypt-prod
  service:
    name: bookinfo-productpage-dev

details:
  replicas: 1
  version: "v1"
  image:
    repository: registry-supeem.opsta.in.th/library/details-service
    tag: "v1"
    pullPolicy: Always
  service:
    name: bookinfo-details-dev
    port: 9080
  env:
    enableExternalBookService: "false"
    doNotEncrypt: "false"

ratings:
  replicas: 1
  version: "v2"
  image:
    repository: registry-supeem.opsta.in.th/library/ratings-service
    tag: "v2"
    pullPolicy: Always
  service:
    name: bookinfo-ratings-dev
    port: 9080
  
  env:
    version: "v2"
    mongoUrl: "mongodb://mongodb-dev:27017" 
    dbName: "ratings"
  
  mongodbSecret:
    name: mongodb-creds-dev
    usernameKey: db-username
    passwordKey: mongodb-passwords

reviews:
  replicas: 1
  version: "v1"
  image:
    repository: registry-supeem.opsta.in.th/library/reviews-service
    tag: "v1"
    pullPolicy: Always
  service:
    name: bookinfo-reviews-dev
    port: 9080
  env:
    starColor: "black"
    enableRatings: "true"
    ratingsService: "http://bookinfo-ratings-dev:9080"
    clusterName: "cluster-1"

productpage:
  replicas: 1
  version: "v1"
  image:
    repository: registry-supeem.opsta.in.th/library/productpage-service
    tag: "v1"
    pullPolicy: Always
  service:
    name: bookinfo-productpage-dev
    port: 9080
  env:
    detailsHostname: "http://bookinfo-details-dev:9080"
    ratingsHostname: "http://bookinfo-ratings-dev:9080"
    reviewsHostname: "http://bookinfo-reviews-dev:9080"
    floodFactor: "0"

mongodb:
  fullnameOverride: "mongodb-dev" #Service name
  architecture: standalone
  auth:
    username: user1
    database: ratings
    existingSecret: mongodb-creds-dev
    passwordKey: mongodb-passwords
    rootPasswordKey: mongodb-root-password
    userNameKey: db-username
  initdbScriptsConfigMap: mongodb-init-script-dev
  persistence:
    enabled: true
    size: 8Gi
  extraEnvVars:
  - name: MONGODB_USERNAME
    valueFrom:
      secretKeyRef:
        name: mongodb-creds-dev
        key: db-username
  - name: MONGODB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: mongodb-creds-dev
        key: mongodb-passwords
  - name: MONGODB_DATABASE
    value: "ratings"