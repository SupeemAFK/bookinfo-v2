spec:
  inputs:
    release_version:
      type: string 
      description: "Semantic version (e.g., 1.2.0)"
      default: ""
    target_service:
      type: string 
      description: "Service to release"
      options: ["productpage", "details", "ratings", "reviews", "none"]
      default: "none"

---

stages:
  - triggers

trigger_productpage:
  stage: triggers
  trigger:
    include: src/productpage/.gitlab-ci.yml
    strategy: depend
  variables:
    CHOSEN_SERVICE: $[[ inputs.target_service ]]
    RELEASE_VERSION: $[[ inputs.release_version ]]
  rules:
    - if: '$CHOSEN_SERVICE == "productpage"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      changes:
        - src/productpage/**/*
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - src/productpage/**/*
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'
      changes:
        - src/productpage/**/*

trigger_details:
  stage: triggers
  trigger:
    include: src/details/.gitlab-ci.yml
    strategy: depend
  variables:
    CHOSEN_SERVICE: $[[ inputs.target_service ]]
    RELEASE_VERSION: $[[ inputs.release_version ]]
  rules:
    - if: '$CHOSEN_SERVICE == "details"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      changes:
        - src/details/**/*
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - src/details/**/*
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'
      changes:
        - src/details/**/*


trigger_ratings:
  stage: triggers
  trigger:
    include: src/ratings/.gitlab-ci.yml
    strategy: depend
  variables:
    CHOSEN_SERVICE: $[[ inputs.target_service ]]
    RELEASE_VERSION: $[[ inputs.release_version ]]
  rules:
    - if: '$CHOSEN_SERVICE == "ratings"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      changes:
        - src/ratings/**/*
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - src/ratings/**/*
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'
      changes:
        - src/ratings/**/*

trigger_reviews:
  stage: triggers
  trigger:
    include: src/reviews/.gitlab-ci.yml
    strategy: depend
  variables:
    CHOSEN_SERVICE: $[[ inputs.target_service ]]
    RELEASE_VERSION: $[[ inputs.release_version ]]
  rules:
    - if: '$CHOSEN_SERVICE == "reviews"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      changes:
        - src/reviews/**/*
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - src/reviews/**/*
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'
      changes:
        - src/reviews/**/*