spec:
  inputs:
    release_version:
      type: string 
      description: "Semantic version (e.g., 1.2.0)"
      default: ""
    target_service:
      type: string 
      description: "Service to release"
      options: ["productpage", "details", "ratings", "reviews", "none"]
      default: "none"

---

stages:
  - triggers

trigger_productpage:
  stage: triggers
  trigger:
    include: src/productpage/.gitlab-ci.yml
    strategy: depend
  variables:
    RELEASE_VERSION: $[[ inputs.release_version ]]
  rules:
    - if: '$[[ inputs.target_service ]] == "productpage"'
  #  - changes:
  #    - src/productpage/**/*