gitlabUrl: https://gitlab.com/

rbac:
  create: true

runners:
  serviceAccountName: gitlab-runner
  privileged: true
  builds:
    cpuLimit: 1000m
    cpuRequests: 100m
    memoryLimit: 2Gi
    memoryRequests: 256Mi
  config: |
    [[runners]]
      [runners.kubernetes]
        image = "alpine:latest"
        privileged = true
        run_as_user = 0
        namespace_overwrite_allowed = "devops-tools"
        service_account_overwrite_allowed = "gitlab-deployer"
        [[runners.kubernetes.volumes.host_path]]
          name = "odc-cache"
          mount_path = "/var/lib/odc-data"    
          host_path = "/tmp/dependency-check-data"
          read_only = false